schema: schema/schema.graphqls
documents:
  - 'src/**/*.{ts,tsx}':
      noRequire: true
  - '!src/**/*.test.{ts,tsx}'
  - '!src/test/**'
  - '!src/api/generated.ts'
generates:
  src/api/generated.ts:
    plugins:
      - typescript-operations
    config:
      strictScalars: true
      defaultScalarType: unknown
      scalars:
        ID: string
        JSON: unknown
        Upload:
          input: File
          output: never
